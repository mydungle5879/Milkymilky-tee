<!DOCTYPE html>
<html lang="en">
<head>
  <title>May and Leaf - Handcrafted Buble Tea</title>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="./styles.css"/>
</head>
   <body>
  <header>Feedback Form
  <p>Thankyou for visting <em>May and Leaf</em>- Handcrafted Bubble Tea. We value your feedback to help us serve you better. Please take a moment to answer the following questions</p>
 </header> 
     <main>
       <form method="POST" action="https://hotel-feedback.freecodecamp.org">
         <fieldset>
           <legend>Personal Information</legend>
           <label for="full-name">Name:</label>
           <input type="text" id="full-name" name="name" placeholder="Dung Le" required size="20">
           <label for="email">Email Adress:</label>
           <input placeholder="example@gmail.com" id="email" type="email" name="email" size="20"/>
           <label for="age">Age (optional):</label>
           <input type="number" name"age" id="age" min="3" max="100"/>
           <label for="text">Which drinks did you order?</label>
           <input type="text" id="text" name="text" placeholder="Oolong Tea" required size="20"
          </fieldset>

         <fieldset>
          <legend>1.How satisfied were you with your overall experience at our store?</legend>
         <input type="checkbox" id="very-sastisfied" name="choice" value="very-sastisfied"/>
           <label for="very-sastisfied">Very Sastisfied</label>

           <input type="checkbox" id="sastisfied" name="choice" value="sastisfied"/>
           <label for="sastisfied">Sastisfied</label>

           <input type="checkbox" id="neutral" name="choice" value="neutra"/>
           <label for="neutra"><Neutral</label>

              <input type="dissastisfied" id="dissastisfied" name="choice" value="dissastisfied"/>
           <label for="dissastisfied"><Dissastisfied</label>

             <input type="very-dissastisfied" id="very-dissastisfied" name="choice" value="very-dissastisfied"/>
           <label for="very-dissastisfied"><Very Dissastisfied</label>  
         </fieldset>

             <fieldset>
               <legend>Ratings </legend>
               <label for="service">How friendly and helpful was the staff?</label>
               <select name="service" id="service">
                 <option value="Excellent">Excellent</option>
                 <option value="Good">Good</option>
                 <option value="Fair">Fair</option>
                 <option value="Poor">Poor</option>
              <option selected value="Excellent">Excellent</option>
               </select>

               <label for="Drinks">How would you rate the quality of the drinks?</label>
               <select name="drinks" id="drinks">
                 <option value="Excellent">Excellent</option>
                 <option value="Good">Good</option>
                 <option value="Fair">Fair</option>
                 <option value="Poor">Poor</option>
              <option selected value="Excellent">Excellent</option>
               </select>

               
             </fieldset>
           <label for"comments">What could we do to improve your experience?</label>
             <textarea cols="30" rows="10" name="comments" id="comment"></textarea>
             <button type="submit">Submit</button> 
           </form>
               
            
     </main>
   
    
  </body>
